# =============================================================================
#  PARÁMETROS DEL MODELO DE OPTIMIZACIÓN DE RED LOGÍSTICA
#  Edite este archivo y vuelva a ejecutar:  python ejecutar_modelo.py
#  Unidades: volumen en m3, costos en COP, horizonte = 1 mes promedio.
#  Los valores marcados [SUPUESTO] no vienen en los datos: valídelos con su equipo.
# =============================================================================

rutas:
  datos: datos                # carpeta con los CSV (SAP.csv, TMS.csv, maestros...)
  salidas: salidas            # carpeta donde se escriben HTML, Excel y logs
  usar_cache: true            # guarda SAP/TMS leídos en salidas/cache para acelerar corridas

# ----------------------------------------------------------------------------
# Limpieza y reglas de negocio sobre los datos
# ----------------------------------------------------------------------------
limpieza:
  tipos_traslado: [XI]        # Tipo SAP que representa traslado planta/CEDI -> CEDI
  umbral_importe_invalido: 1  # importes <= a este valor (0, 0,9, 1 peso) se omiten del cálculo de fletes
  eliminar_duplicados_exactos: true
  percentil_outlier_tarifa: [1, 99]   # líneas con COP/m3 fuera de estos percentiles se excluyen de las tarifas
  volumen_minimo_lane_m3: 20  # volumen mínimo (en el periodo base) para confiar en la tarifa observada de una ruta
  factor_ruta_km: 1.30        # km por carretera = km línea recta x factor (topografía colombiana)

# Traslados XI con flete en 0 / 1 peso = viajes de FLOTA PROPIA: tienen costo aunque SAP no lo registre.
imputacion_xi:
  metodo: similares        # similares = tarifa COP/m3 de viajes de terceros en la misma ruta (o banda de distancia)
                           # km        = costo fijo por viaje + COP/km x distancia
  costo_km_cop: null       # null = se ajusta con los viajes de terceros (regresión costo viaje vs km)
  costo_fijo_viaje_cop: null

periodo_base:                 # meses completos ANTES del cierre para construir demanda y tarifas
  desde: "2025-07"
  hasta: "2026-06"

# ----------------------------------------------------------------------------
# Homologaciones que no vienen en los datos (inferidas y verificadas en el análisis)
# ----------------------------------------------------------------------------
homologacion:
  # Clientes SAP que en los movimientos XI representan un nodo destino.
  # Los que no están aquí se homologan automáticamente por ciudad del nodo.
  clientes_nodo:
    C717: CO14   # YUMBO -> CEDI Cali
    C720: CO99   # TOCANCIPA -> bodega externa 3PL
    C723: CO29   # Zona Industrial El Papayo (Ibagué)
    C727: CO03   # Guachené -> planta Caloto
    C729: CO03
  # Ciudades (TMS / SAP) que corresponden a un nodo, adicional a la ciudad del maestro de nodos
  ciudades_nodo:
    YUMBO: CO14
    GUACHENE: CO03
    CALOTO: CO03
    TOCANCIPA: CO99
  # Si quiere forzar la homologación planta-referencia -> nodo SAP (si se deja vacío se infiere de SAP)
  plantas_referencia: {}      # ej: {CO06: CO01, CO12: CO02}

# ----------------------------------------------------------------------------
# Almacenamiento
# ----------------------------------------------------------------------------
almacenamiento:
  # Días de cobertura de inventario en CEDI. "auto" = se calibra con los datos: se asume que el CEDI
  # 'nodo_calibracion_doi' está lleno en AS-IS (hoy desborda a la bodega externa CO99).
  # Puede poner un número (ej. 15) para sobreescribirlo.
  dias_inventario: auto
  nodo_calibracion_doi: CO01
  m3_por_posicion: null             # null = se calcula del maestro de referencias (cajas x estiba x m3 caja)
  utilizacion_maxima: 0.85          # [SUPUESTO] info_cedi no trae Utilizacion_Max_Operable_Pct
  penalidad_deficit_cop_m3: 400000  # costo de penalización por m3 de inventario que no cabe (señal de déficit)
  costos_por_modalidad:             # [SUPUESTO] costos variables por m3 movido (entrada+salida)
    Propio:   {manejo_cop_m3: 4500, posicion_cop_mes: 0}
    "Operador logístico (3PL)": {manejo_cop_m3: 8000, posicion_cop_mes: 0}
  # El costo fijo mensual sale de parametros_plantas.csv. Nodos "opcionales" pueden cerrarse
  # (el modelo decide si los usa pagando su costo fijo).
  nodos_opcionales_tobe: [CO99]     # bodega externa actual (3PL Tocancipá): ¿se mantiene o no?
  ajustes_nodo:                     # ej: {CO02: {posiciones_adicionales: 2000, manejo_cop_m3: 5000}}
    CO99: {tarifas_salida_como: CO01}   # CO99 no registra despachos propios: sale como Cajicá

# Bodegas externas candidatas (nuevas). Todas [SUPUESTO]: cotice y ajuste.
bodegas_candidatas:
  - id: BE_ANTIOQUIA
    nombre: Bodega externa Itagüí (Antioquia)
    ciudad: ITAGUI
    lat: 6.172
    lon: -75.611
    posiciones: 6000
    costo_fijo_cop_mes: 60000000
    posicion_cop_mes: 38000
    manejo_cop_m3: 9000
    tarifas_salida_como: CO02         # usa las tarifas de distribución observadas de este CEDI
    tarifa_entrada_como: null         # null = estima por distancia desde cada planta
    activa: true
  - id: BE_SABANA
    nombre: Bodega externa Funza (Sabana de Bogotá)
    ciudad: FUNZA
    lat: 4.716
    lon: -74.211
    posiciones: 8000
    costo_fijo_cop_mes: 70000000
    posicion_cop_mes: 36000
    manejo_cop_m3: 9000
    tarifas_salida_como: CO01
    tarifa_entrada_como: CO99         # usa la tarifa observada Cajicá -> bodega externa Tocancipá
    activa: true

# ----------------------------------------------------------------------------
# Producción
# ----------------------------------------------------------------------------
produccion:
  planta_cerrada: CO10
  excluir_descontinuadas: true        # referencias "Descontinuada" se excluyen en todos los escenarios (comparables)
  utilizacion_maxima_planta: 1.0
  crecimiento_demanda: 0.0            # 0.05 = +5 % sobre la demanda base

# ============================================================================
# MODELO MULTIPERIODO DIARIO (versión 3)
# ============================================================================
horizonte:
  inicio_ventana: "2026-05-04"   # primer día de la ventana histórica (lunes) que se replica como demanda proyectada
  dias_ventana: 56               # días que se envían al HTML (el horizonte puede moverse dentro de la ventana)
  horizonte_dias: 28             # días que optimiza cada escenario
  desplazamiento: 0              # día de la ventana en que empieza el horizonte

# Parámetros por defecto del modelo diario (los mismos que se editan en el HTML > Simulación)
modelo:
  proyeccion: replica            # replica = mismo patrón diario de la ventana histórica | perfil = promedio por día de semana
  crecimiento: 0.0               # crecimiento global de demanda (0.10 = +10 %)
  crec_N: 0.0                    # adicional mercado nacional
  crec_E: 0.0                    # adicional exportación
  utilizacion_maxima: 0.85       # [SUPUESTO] fracción usable de las posiciones
  produccion:
    modo: plan                   # plan = producción estable (fija) | flexible = el modelo decide dentro de la capacidad
    dias_semana: 6               # [SUPUESTO] lunes a sábado
    factor: 1.0                  # producción del horizonte / demanda del horizonte
  inventario:
    dias_inicial_planta: 8       # [SUPUESTO] inventario inicial en planta = días de demanda de sus productos
    dias_inicial_cedi: 10        # [SUPUESTO] inventario inicial en CEDI = días de la demanda que atendió históricamente
    dias_seguridad: 7            # [SUPUESTO] stock de seguridad objetivo en cada nodo (días de la demanda asignada)
    final_min: 1.0               # inventario final de la red >= este factor x inventario inicial (evita "vaciar" la red)
    final_por_nodo: true         # true: cada nodo termina con la cobertura (días) de la demanda que atiende en el nuevo esquema; false: solo el total de la red
    ocupacion_inicial_max: 0.7   # el inventario inicial de la regla no supera este % de las posiciones del nodo
  traslados: plantas_y_observados  # solo_plantas | plantas_y_observados | todos
  traslado_ficticio_mismo_codigo: true   # planta y CEDI con el mismo código: movimiento contable sin costo ni tránsito
  servicio:
    lmax_h: null                 # tiempo máximo de entrega permitido (h). null = sin restricción
    meta_h: 72                   # meta de tiempo de entrega para el indicador y la penalización
    pen_hora: 0                  # COP por m3 por cada hora sobre la meta (0 = solo indicador)
  holguras:                      # variables que hacen visible una infactibilidad en vez de esconderla
    atraso: true
    pen_atraso: 60000            # COP por m3 por día de atraso (pedido atendido tarde)
    pen_no_atendido: 1500000     # COP por m3 no atendido al final del horizonte (venta perdida)
    exceso: true
    pen_exceso: 100000           # COP por m3 por día sobre la capacidad física (debe salir 0; si no, falta capacidad)
    pen_stock_seguridad: 2000    # COP por m3 por día por debajo del stock de seguridad
  costo_capital_dia: 0           # COP por m3 por día de inventario en cualquier nodo (costo financiero). 0 = no incluido
  transporte:
    f_terc: 1.0
    f_prop: 1.0
    f_dist: 1.0
  costos_nodo:                   # [SUPUESTO] manejo por m3 y almacenaje por m3-día por modalidad
    Propio: {manejo_salida: 4500, manejo_entrada: 0, almac_dia: 0}
    "Operador logístico (3PL)": {manejo_salida: 5000, manejo_entrada: 3000, almac_dia: 0}

# Escenarios: cada uno modifica los parámetros por defecto
#   planta_cerrada: id o null | asignacion: libre / historica | bodegas: {id: fijo|opcional|forzado|cerrado}
escenarios_diarios:
  - id: S1_ACTUAL_OPT
    nombre: "Actual optimizado (con la planta operando)"
    planta_cerrada: null
    bodegas: {CO99: forzado, BE_ANTIOQUIA: cerrado, BE_SABANA: cerrado}
  - id: S2_SIN_PLANTA
    nombre: "Sin planta (cierre con la red de atención actual)"
    asignacion: historica
    bodegas: {CO99: forzado, BE_ANTIOQUIA: cerrado, BE_SABANA: cerrado}
  - id: S3_OPTIMIZADO
    nombre: "Optimizado (cierre, el modelo decide)"
    bodegas: {CO99: opcional, BE_ANTIOQUIA: opcional, BE_SABANA: opcional}
  - id: S4_BE_OBLIGATORIA
    nombre: "Uso obligatorio de bodegas externas"
    bodegas: {CO99: forzado, BE_ANTIOQUIA: forzado, BE_SABANA: forzado}
  - id: S5_SIN_BE
    nombre: "Sin bodegas externas"
    bodegas: {CO99: cerrado, BE_ANTIOQUIA: cerrado, BE_SABANA: cerrado}
  - id: S6_DEMANDA_MAS20
    nombre: "Optimizado con demanda +20 %"
    crecimiento: 0.20
    bodegas: {CO99: opcional, BE_ANTIOQUIA: opcional, BE_SABANA: opcional}
  - id: S7_PARAMETRIZADO
    nombre: "Parametrizado (editable en el HTML)"
    bodegas: {CO99: opcional, BE_ANTIOQUIA: opcional, BE_SABANA: opcional}

combinaciones_bodegas:            # evalúa todas las combinaciones abierto/cerrado de estas bodegas (escenario optimizado)
  activa: true
  bodegas: [CO99, BE_ANTIOQUIA, BE_SABANA]

solver:
  tiempo_maximo_seg: 300
  gap_relativo: 0.001
